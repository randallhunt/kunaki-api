name: unit test

on:
  pull_request:
    branches:
      - '*'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: unit testss
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Yarn
        run: |
          yarn --version
          yarn

      - name: Run tests
        run: yarn test
